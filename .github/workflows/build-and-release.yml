name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The reporting address is provisioned here from repository secrets and written to BuildSecrets.props,
      # which is git-ignored. It therefore never enters the source tree, where a public-repository scanner
      # would find it: that is exactly how two earlier webhook URLs were discovered and deleted by Discord on
      # 2026-11-15. A fork or a plain push without the secrets provisions nothing, and the app asks the user
      # for an address at first use instead.
      - name: Provision reporting address (optional)
        shell: pwsh
        env:
          REPORT_HOOK: ${{ secrets.STUTTERGUARD_REPORT_WEBHOOK }}
          FEEDBACK_HOOK: ${{ secrets.STUTTERGUARD_FEEDBACK_WEBHOOK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REPORT_HOOK) -and [string]::IsNullOrWhiteSpace($env:FEEDBACK_HOOK)) {
            Write-Host "No reporting address configured for this build; the app asks for one at first use."
            exit 0
          }
          # Plain text, no XML library, so this behaves the same on PowerShell 5.1 and 7. The values are
          # read from the environment straight into the file and are never echoed.
          function Esc($s) { if ($null -eq $s) { return "" } return $s.Replace("&","&amp;").Replace("<","&lt;").Replace(">","&gt;") }
          $xml = "<Project>`n  <PropertyGroup>`n" +
                 "    <StutterGuardReportWebhook>" + (Esc $env:REPORT_HOOK) + "</StutterGuardReportWebhook>`n" +
                 "    <StutterGuardFeedbackWebhook>" + (Esc $env:FEEDBACK_HOOK) + "</StutterGuardFeedbackWebhook>`n" +
                 "  </PropertyGroup>`n</Project>`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD "BuildSecrets.props"), $xml, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Reporting address provisioned from repository secrets (values not printed)."
      - name: Run Self Tests
        run: dotnet run --project tests/DpcTweaker.SelfTest -c Release

      - name: Publish Single-File Executable
        run: dotnet publish src/DpcTweaker.App/DpcTweaker.App.csproj -c Release -o publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StutterGuard-x64
          path: publish/StutterGuard.exe
          if-no-files-found: error

      # The checksum has to be produced by the same job that uploads the binary, from the file it
      # is about to upload. A hand-maintained checksum in the repository drifts the moment a new
      # release is cut, and then it describes a file nobody can download.
      - name: Write the download checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash publish/StutterGuard.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  StutterGuard.exe" | Set-Content -Path publish/StutterGuard.exe.sha256 -NoNewline
          Get-Content publish/StutterGuard.exe.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/StutterGuard.exe
            publish/StutterGuard.exe.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
