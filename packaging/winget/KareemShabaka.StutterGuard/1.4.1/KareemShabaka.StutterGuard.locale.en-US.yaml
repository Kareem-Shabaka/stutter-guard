ShortDescription: Stop game stutter and audio dropouts by pinning device interrupts to dedicated CPU cores
Description: >-
  Stutter Guard fixes the stutter that average FPS hides. It measures wake latency on every physical core, then
  pins each busy device - GPU, USB mouse and keyboard controller, audio interface, network adapter - to a core of
  its own, away from the ones your game or DAW runs on. On AMD dual-CCD X3D chips the whole V-Cache CCD stays free
  of device work; on Intel hybrid it is the P-cores; every system keeps CPU 0 and 1 clear.
  For real-time audio it traces your active output back to its PCI or USB controller, moves that controller onto a
  dedicated core, and turns off the power saving that causes buffer underruns: USB selective suspend, USB 3 link
  power saving, PCIe ASPM and deep C-states. It also aligns network receive queues with the adapter's own interrupt
  core, enables MSI mode where hardware supports it, and audits installed drivers against known latency-causing
  releases.
  Everything is reversible. Each write is recorded to a journal on disk before it happens, and an independent
  undo-all.ps1 is regenerated on every change, so the whole lot can be reverted without this app - including from
  Safe Mode. No kernel driver, no registry hacks smuggled in, no tweak without a stated cost and an evidence class.
